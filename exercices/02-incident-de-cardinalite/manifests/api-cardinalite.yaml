apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: apps
spec:
  template:
    spec:
      containers:
        - name: orders-api
          env:
            - name: ORDERS_HIGH_CARDINALITY
              value: "true"
