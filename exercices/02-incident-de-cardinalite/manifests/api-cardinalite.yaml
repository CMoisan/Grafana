# NE LISEZ PAS CE FICHIER AVANT D'AVOIR DIAGNOSTIQUE.
# =============================================================================
# Il contient la cause de la panne. Tout l'interet de l'exercice est de la
# retrouver par les symptomes — dashboards vides, 429 cote Mimir, file d'attente
# qui gonfle cote Alloy — exactement comme un matin ou une equipe produit a
# deploye la veille au soir.
