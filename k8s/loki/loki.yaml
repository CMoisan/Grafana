# =============================================================================
# DEPLOIEMENT LOKI (StatefulSet, mode "monolithic" / single binary)
# =============================================================================
# Loki a 3 modes de deploiement, question quasi certaine en entretien :
#  1. Monolithic      : 1 process, tout dedans. < 100 Go/jour. (ce lab)
#  2. Simple scalable : 3 groupes (read / write / backend). Le sweet spot
#                       pour la plupart des clients, jusqu'a quelques To/jour.
#  3. Microservices   : chaque composant separe. Multi-To/jour, tres flexible,
#                       mais couteux en exploitation.
# Le bon reflexe en avant-vente : ne JAMAIS proposer microservices d'emblee.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability
  labels: { app: loki }
spec:
  ports:
    - { name: http, port: 3100, targetPort: http }
    - { name: grpc, port: 9096, targetPort: grpc }
  selector: { app: loki }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: observability
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels: { app: loki }
  template:
    metadata:
      labels:
        app: loki
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3100"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsNonRoot: true
      containers:
        - name: loki
          image: grafana/loki:3.7.1
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - { name: http, containerPort: 3100 }
            - { name: grpc, containerPort: 9096 }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
          # PAS de livenessProbe sur /ready ici : au demarrage Loki peut mettre
          # du temps a rejouer son WAL. Une liveness trop agressive tuerait le
          # pod en boucle avant qu'il ait fini -> CrashLoopBackOff eternel.
          # Erreur tres frequente chez les clients.
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: "2",  memory: 1536Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: storage, mountPath: /loki }
      volumes:
        - name: config
          configMap: { name: loki-config }
  volumeClaimTemplates:
    - metadata: { name: storage }
      spec:
        accessModes: [ ReadWriteOnce ]
        resources:
          requests: { storage: 5Gi }
